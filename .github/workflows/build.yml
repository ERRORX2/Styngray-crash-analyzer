name: Build Stingray Crash Analyzer & Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: "1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Prepare Artifact Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          New-Item -ItemType Directory -Force artifact\sha256 | Out-Null

      - name: Build Executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm `
            --onefile `
            --noconsole `
            --name "StingrayAnalyzer" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --add-data "crash_patterns.json;." `
            stingray_crash_analyzer.py

          if (-not (Test-Path "dist\StingrayAnalyzer.exe")) {
            throw "Build failed"
          }

          Copy-Item "dist\StingrayAnalyzer.exe" "artifact\" -Force
          Copy-Item "crash_patterns.json" "artifact\" -Force

      - name: Generate Build Info
        shell: pwsh
        run: |
          $buildInfo = @{
            version = "${{ github.ref_name }}"
            date = Get-Date -Format "yyyy-MM-dd"
            commit = "${{ github.sha }}"
            builder = "github-actions"
            tool = "pyinstaller"
          } | ConvertTo-Json -Depth 10

          $buildInfo | Set-Content "artifact\build_info.json" -Encoding utf8

      - name: Generate SHA256 Hashes
        shell: pwsh
        run: |
          $exeHash  = (Get-FileHash "artifact\StingrayAnalyzer.exe" -Algorithm SHA256).Hash
          $jsonHash = (Get-FileHash "artifact\crash_patterns.json" -Algorithm SHA256).Hash

          $exeHash  | Set-Content "artifact\sha256\exe.sha256"
          $jsonHash | Set-Content "artifact\sha256\patterns.sha256"

      - name: Create Manifest
        shell: pwsh
        run: |
          $exeHash  = Get-Content "artifact\sha256\exe.sha256"
          $jsonHash = Get-Content "artifact\sha256\patterns.sha256"

          $manifest = @{
            version = "${{ github.ref_name }}"
            build_date = Get-Date -Format "yyyy-MM-dd"
            files = @{
              "StingrayAnalyzer.exe" = $exeHash
              "crash_patterns.json" = $jsonHash
            }
          } | ConvertTo-Json -Depth 10

          $manifest | Set-Content "artifact\manifest.json" -Encoding utf8

          $manifestHash = (Get-FileHash "artifact\manifest.json" -Algorithm SHA256).Hash
          $manifestHash | Set-Content "artifact\sha256\manifest.sha256"

      - name: Create Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "release_$tag.zip"

          Compress-Archive `
            -Path "artifact\*" `
            -DestinationPath "artifact\$zip" `
            -Force

          $zipHash = (Get-FileHash "artifact\$zip" -Algorithm SHA256).Hash
          $zipHash | Set-Content "artifact\sha256\zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: artifact/

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/release_*.zip
          prerelease: ${{ contains(github.ref_name, '-dev') }}

  update_readme:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-dev')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:

          token: ${{ secrets.PAT_README || secrets.GITHUB_TOKEN }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: artifact/

      - name: Update README
        shell: pwsh
        run: |
          if (-not (Test-Path README.md)) {
            Write-Host "README.md not found — skipping update."
            exit 0
          }

          $tag     = "${{ github.ref_name }}"
          $date    = Get-Date -Format "yyyy-MM-dd"
          $zipName = "release_$tag.zip"
          $repoUrl = "https://github.com/${{ github.repository }}"

          $exeHash      = (Get-Content "artifact\sha256\exe.sha256").Trim()
          $jsonHash     = (Get-Content "artifact\sha256\patterns.sha256").Trim()
          $manifestHash = (Get-Content "artifact\sha256\manifest.sha256").Trim()
          $zipHash      = (Get-Content "artifact\sha256\zip.sha256").Trim()

          $lines = @(
            "<!-- LATEST_RELEASE_START -->",
            "### Latest Release: $tag ($date)",
            "",
            "- Download: [$zipName]($repoUrl/releases/download/$tag/$zipName)",
            "- All releases: [releases]($repoUrl/releases)",
            "",
            "### Cryptographic Integrity",
            "",
            "<details>",
            "<summary>SHA-256 Hashes</summary>",
            "",
            "| File | SHA-256 |",
            "|---|---|",
            "| ``StingrayAnalyzer.exe`` | ``$exeHash`` |",
            "| ``crash_patterns.json`` | ``$jsonHash`` |",
            "| ``manifest.json`` | ``$manifestHash`` |",
            "| ``$zipName`` | ``$zipHash`` |",
            "",
            "</details>",
            "<!-- LATEST_RELEASE_END -->"
          )
          $block = $lines -join "`n"

          $readme = Get-Content README.md -Raw -Encoding utf8


          $pattern = "(?ms)^<!-- LATEST_RELEASE_START -->.*?^<!-- LATEST_RELEASE_END -->"

          if ($readme -match $pattern) {
            $readme = [regex]::Replace($readme, $pattern, { param($m) $block })
          } else {
            if (-not $readme.EndsWith("`n")) { $readme += "`n" }
            $readme += "`n" + $block + "`n"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path README.md).Path, $readme, $utf8NoBom)

      - name: Commit README
        shell: pwsh
        run: |
          git diff --quiet README.md
          if ($LASTEXITCODE -eq 0) {
            Write-Host "README.md unchanged — nothing to commit."
            exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update release ${{ github.ref_name }}"

          $rebased = $false
          try {
            git pull --rebase origin master
            if ($LASTEXITCODE -eq 0) { $rebased = $true }
          } catch {
            Write-Host "Rebase threw — falling back to merge."
          }
          if (-not $rebased) {
            Write-Host "Rebase failed — aborting and retrying as merge."
            git rebase --abort 2>$null
            git pull --no-rebase origin master 2>$null
            git add README.md
            git commit -m "docs: update release ${{ github.ref_name }} (merge)" 2>$null
          }

          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push origin HEAD:master 2>&1 | Out-Host
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            Write-Host "Push attempt $i failed — pulling and retrying."
            git pull --rebase origin master 2>$null
          }

          if (-not $pushed) {
            Write-Host "::warning::Failed to push README update after 3 attempts. The release is published; the README will update on the next release."
            exit 0
          }
